[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiorhub-pseudo-claude"
version = "1.0.0"
description = "AxiorHub Pseudonymisation Claude - Créé par Timo RAINIO Avocat. Proxy local de pseudonymisation entre Claude Code et l'API Claude."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Timo RAINIO Avocat" }]
keywords = ["rgpd", "pseudonymisation", "proxy", "claude", "anthropic"]
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pdfminer.six>=20231228",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
axiorhub-pseudo = "pseudo_proxy.cli:main"

[tool.setuptools.packages.find]
include = ["pseudo_proxy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
